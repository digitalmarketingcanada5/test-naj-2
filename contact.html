<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #2d3748;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 980px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      overflow: hidden;
    }

    .info {
      background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .info h1 {
      font-size: 28px;
      line-height: 1.2;
    }

    .info p.lead {
      opacity: 0.9;
      font-size: 15px;
      line-height: 1.6;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      font-size: 14px;
    }

    .info-item .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .info-item strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .info-item span { opacity: 0.95; }

    .socials {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .socials a {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }

    .socials a:hover { background: rgba(255, 255, 255, 0.32); }

    form {
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    form h2 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    form p.sub {
      color: #718096;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
    }

    input, textarea, select {
      font: inherit;
      padding: 11px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f7fafc;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      margin-top: 6px;
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }

    button:active { transform: translateY(0); }

    .status {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      display: block;
      background: #f0fff4;
      color: #2f855a;
      border: 1px solid #c6f6d5;
    }

    .status.error {
      display: block;
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #fed7d7;
    }

    @media (max-width: 720px) {
      .container { grid-template-columns: 1fr; }
      .info, form { padding: 32px 24px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="info">
      <div>
        <h1>Get in touch</h1>
        <p class="lead">Have a question, project, or just want to say hello? Fill out the form and we'll get back to you within 24 hours.</p>
      </div>

      <div class="info-item">
        <div class="icon">@</div>
        <div>
          <strong>Email</strong>
          <span>hello@example.com</span>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">#</div>
        <div>
          <strong>Phone</strong>
          <span>+1 (555) 123-4567</span>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">^</div>
        <div>
          <strong>Office</strong>
          <span>123 Market Street<br />San Francisco, CA 94103</span>
        </div>
      </div>

      <div class="socials" aria-label="Social links">
        <a href="#" aria-label="Twitter">Tw</a>
        <a href="#" aria-label="LinkedIn">In</a>
        <a href="#" aria-label="GitHub">Gh</a>
      </div>
    </section>

    <form id="contactForm" novalidate>
      <h2>Send a message</h2>
      <p class="sub">We'd love to hear from you.</p>

      <div class="row">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" required autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" required autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com" />
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Select a topic</option>
          <option value="general">General inquiry</option>
          <option value="support">Support</option>
          <option value="sales">Sales</option>
          <option value="partnership">Partnership</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Tell us a bit about your question or project..."></textarea>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <button type="submit">Send message</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      status.className = 'status';
      status.textContent = '';

      const data = Object.fromEntries(new FormData(form).entries());
      const missing = Object.entries(data).filter(([, v]) => !v.trim()).map(([k]) => k);

      if (missing.length) {
        status.classList.add('error');
        status.textContent = 'Please fill out all fields before sending.';
        return;
      }

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);
      if (!emailOk) {
        status.classList.add('error');
        status.textContent = 'Please enter a valid email address.';
        return;
      }

      status.classList.add('success');
      status.textContent = `Thanks, ${data.firstName}! Your message has been sent.`;
      form.reset();
    });
  </script>
</body>
</html>
